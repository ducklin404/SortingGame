# ===============================
# Sorting Game Custom Theme
# ===============================

# ====== FONT (toàn app) ======
defaultFont = 16 "Segoe UI"

# ====== Component bo góc ======
Component.arc = 12
Button.arc = 20
TextComponent.arc = 12
ProgressBar.arc = 12

# ====== Màu n?n ======
Panel.background = #F5F7FA
Button.background = #4F7DF9
Button.foreground = white

# ====== Button hover ======
Button.hoverBackground = #6A92FA
Button.pressedBackground = #3E68E0

# ====== Table ======
Table.rowHeight = 28
Table.selectionBackground = #D6E2FF
Table.showHorizontalLines = true
Table.selectionForeground = black
Table.background = white
Table.foreground = #1E1E1E

TableHeader.height = 30
TableHeader.background = #E8EBF0
TableHeader.foreground = #333333

# ====== Scrollbar ======
ScrollBar.thumbArc = 10
ScrollBar.thumbInsets = 2,2,2,2
ScrollBar.trackInsets = 3,3,3,3
ScrollBar.background = #E8EBF0
ScrollBar.thumb = #C0C8D2

# ====== TextField ======
TextField.background = white
TextField.foreground = #222222
TextField.borderColor = #A9B4C6

# ====== TitledBorder ======
TitledBorder.titleColor = #555555
TitledBorder.borderColor = #D0D6E0
